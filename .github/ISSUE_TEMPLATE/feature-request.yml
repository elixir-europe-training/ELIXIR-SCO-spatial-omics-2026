name: Feature Request
description: Suggest content improvements, additions, or changes
title: "[Feature]: "
body:
  - type: checkboxes
    id: type
    attributes:
      label: What type of suggestion?
      options:
        - label: Add new content/example
        - label: Improve existing instructions
        - label: Fix unclear wording
        - label: Add missing dataset/file
        - label: Other

  - type: checkboxes
    id: location
    attributes:
      label: Where should this apply?
      options:
        - label: Practical 1
        - label: Practical 2
        - label: Practical 3
        - label: Practical 4
        - label: Practical 5
        - label: Practical 6
        - label: Practical 7
        - label: Practical 8
        - label: Practical 9
        - label: Practical 10
        - label: General / other section

  - type: textarea
    id: description
    attributes:
      label: Describe your suggestion
      description: What would you like to see added or changed?
      placeholder: |
        Example: Add a download link for the Xenium dataset in Practical 3.

  - type: textarea
    id: reason
    attributes:
      label: Why is this helpful?
      description: What problem does this solve?

  - type: textarea
    id: example
    attributes:
      label: Example (optional)
      description: Show what you mean if possible
      render: code