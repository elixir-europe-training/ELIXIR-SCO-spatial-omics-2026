name: Build and Push Docker Images to GHCR

on:
  push:
    branches:
      - main
      - feature/gh-actions
    paths:
      - 'docker/**'
      - 'practicals/*/env/**'
      - '.github/workflows/build-docker-images.yml'

env:
  REGISTRY: ghcr.io

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Jupyter containers for practicals 0-5
          - practical: 0
            ide: jupyter
          - practical: 1
            ide: jupyter
          - practical: 2
            ide: jupyter
          - practical: 3
            ide: jupyter
          - practical: 4
            ide: jupyter
          - practical: 5
            ide: jupyter
          # RStudio container for practical 7
          - practical: 7
            ide: rstudio
          # Jupyter containers for practicals 8-9
          - practical: 8
            ide: jupyter
          - practical: 9
            ide: jupyter

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate version timestamp
        id: version
        run: |
          VERSION=$(date -u +'%Y%m%d-%H%M%S')
          echo "timestamp=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Build version: $VERSION"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=practical-${{ matrix.practical }}-${{ matrix.ide }}-${{ steps.version.outputs.timestamp }}
            type=raw,value=practical-${{ matrix.practical }}-${{ matrix.ide }}-latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/${{ matrix.ide }}/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            PRAC=${{ matrix.practical }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
