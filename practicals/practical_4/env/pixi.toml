[project]
authors = [{name = "Leslie Solorzano", email = "leslie.solorzano@icm.uu.se"}]
dependencies = ["zarr>=3.0.0", "spatialdata[extra]>=0.8.0,<0.9", "spatialdata-io>=0.7.1,<0.8"]
name = "spatial_zarr3_project"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
spatial_zarr3_project = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
leidenalg = ">=0.12.0,<0.13"
