[workspace]
authors = ["Aditya Singh <dr.singhaditya@hotmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "env"
platforms = ["linux-64"]
version = "0.1.0"

[activation]
env = { DGLBACKEND = "pytorch" }

[tasks]
lab = { cmd = "jupyter lab" }

[dependencies]
python = "3.10.21.*"
numpy = "2.2.6.*"
pandas = "2.3.3.*"
scipy = "1.15.2.*"
scikit-learn = "1.7.2.*"
statsmodels = "0.15.0.*"
numba = "0.67.0.*"
llvmlite = "0.49.0.*"
joblib = "1.6.0.*"
threadpoolctl = "3.6.0.*"
anndata = "0.11.4.*"
scanpy = "1.11.5.*"
pynndescent = "0.6.0.*"
umap-learn = "0.5.12.*"
matplotlib = "3.10.9.*"
seaborn = "0.13.2.*"
pillow = "12.3.0.*"
jupyterlab = "4.6.3.*"
notebook = "7.6.2.*"
ipykernel = "7.3.0.*"
nbformat = "5.11.1.*"
nbconvert-core = "7.17.1.*"
ipython = "8.37.0.*"
matplotlib-inline = "0.2.2.*"
setuptools = "84.0.0.*"
arrow = "1.4.0.*"
h5py = "3.16.0.*"
hdf5 = "2.2.0.*"
jinja2 = "3.1.6.*"
markupsafe = "3.0.3.*"
beautifulsoup4 = "4.15.0.*"
tqdm = "4.70.0.*"
shapely = "2.1.2.*"
rtree = "1.4.1.*"

[pypi-options]
index-url = "https://download.pytorch.org/whl/cpu"
extra-index-urls = ["https://pypi.org/simple", "https://data.dgl.ai/wheels/torch-2.4/cpu/repo.html"]
index-strategy = "unsafe-best-match"

[pypi-dependencies]
torch = "==2.4.0+cpu"
torchaudio = "==2.4.0+cpu"
torchvision = "==0.19.0+cpu"
torchdata = "==0.7.1"
ipywidgets = "==8.1.9"
pydantic = "==2.13.5"
sympy = "==1.13.1"
geopandas = "==1.1.4"
pyproj = "==3.7.1"
pyogrio = "==0.13.0"
dgl = "==2.1.0"
# CAST installed via post-link script (see .pixi/post-link.sh)
cast = { git = "https://github.com/wanglab-broad/CAST.git" }