[workspace]
authors = ["Aditya Singh <dr.singhaditya@hotmail.com>"]
channels = ["dglteam/label/th24_cpu","conda-forge", "bioconda"]
name = "env"
platforms = ["linux-64"]
version = "0.1.0"

[activation]
env = { DGLBACKEND = "pytorch" }

[tasks]

[dependencies]

torchdata = ">0.7.0,<=0.9.0"
pytorch = "<=2.4.9"
nbconvert = ">=7.17.1,<8"
nbformat = ">=5.11.1,<6"
umap-learn = ">=0.5.12,<0.6"
torchvision = ">=0.19.1,<0.20"
torchaudio = ">=2.4.1,<3"
h5py = ">=3.16.0,<4"
pyyaml = ">=6.0.3,<7"
scanpy = ">=1.12.4,<2"
seaborn = ">=0.13.2,<0.14"
matplotlib = ">=3.10.9,<4"
pandas = ">=3.0.5,<4"
numpy = ">=2.5.3,<3"
anndata = ">=0.13.3.post0,<0.14"
scipy = ">=1.18.1,<2"
pillow = ">=12.3.0,<13"
dgl = ">=2.4.0.th24.cpu,<3"
curl = ">=8.18.0,<9"
tar = ">=1.35,<2"
gzip = ">=1.14,<2"

[pypi-dependencies]
cast = { git = "https://github.com/wanglab-broad/CAST.git" }

