# Environment for the "Spatial cell-cell communication" chapter (notebooks/ccc/ccc.ipynb).
#
#   conda env create -f env.yml
#   conda activate spatial-ccc
#   python -m ipykernel install --user --name spatial-ccc
#
# Versions are the ones resolved by a clean `conda env create` on macOS (arm64), 2026-09.
name: spatial-ccc
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      # LIANA+ 2.0 is not on PyPI yet; install from main (commit 08590dbd4 == 2.0.1.dev1).
      - liana @ git+https://github.com/scverse/liana-py@08590dbd4
      # NOTE: lamindb 2.3.1 (as originally specified) pins anndata<=0.12.10, which conflicts
      # with liana main (anndata>=0.13). 2.10.0 is the first release allowing anndata 0.13.
      - lamindb==2.10.0
      - squidpy==1.8.3
      - scanpy==1.12.4
      - anndata==0.13.2
      - pandas==3.0.5
      - numpy==2.4.6
      - scipy==1.18.1
      - scikit-learn==1.9.1
      - statsmodels==0.15.0
      - numba==0.67.0
      - plotnine==0.15.8
      - decoupler==2.2.0
      - matplotlib==3.11.2
      - seaborn==0.13.2
      - jupyterlab==4.6.3
      - ipykernel==7.3.0
      - nbconvert==7.17.1
      # InterScale ("Multi-scale models" section): loads a pre-trained model from Hugging Face and
      # runs it on the CPU. Installing it pulls in torch, torch-geometric, scvi-tools and lightning;
      # none of the pins above move (checked against a pip freeze of this environment, 2026-09-25).
      # Its dependency geome needs torch-cluster, which PyPI ships only as source: install the
      # prebuilt wheel first, e.g. on Linux
      #   pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      #   pip install torch_cluster -f https://data.pyg.org/whl/torch-2.9.1+cpu.html
      - interscale @ git+https://github.com/theislab/interscale@c98a307e4fa3
      - huggingface_hub>=0.34
